<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N94NCBMVFR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-N94NCBMVFR');
  </script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Teaching by Humberto Martinez-Garcia, Assistant Professor of Economics at El Colegio de México.">
  <title>{{ page.title }}</title>

  <link rel="stylesheet" type="text/css" href="{{ '/css/main.css' | relative_url }}">

  <script>
  document.addEventListener("DOMContentLoaded", function() {
    const slides = document.querySelectorAll(".quote-slide");
    const prevBtn = document.querySelector(".quote-nav.prev");
    const nextBtn = document.querySelector(".quote-nav.next");
    const dotsContainer = document.querySelector(".quote-dots");

    if (!slides.length || !prevBtn || !nextBtn || !dotsContainer) return;

    let current = Math.floor(Math.random() * slides.length);

    slides.forEach((_, i) => {
      const dot = document.createElement("button");
      dot.setAttribute("aria-label", "Show testimonial " + (i + 1));
      dot.addEventListener("click", () => goToSlide(i));
      dotsContainer.appendChild(dot);
    });

    const dots = dotsContainer.querySelectorAll("button");

    function showSlide(index) {
      slides.forEach((s, i) => s.classList.toggle("active", i === index));
      dots.forEach((d, i) => d.classList.toggle("active", i === index));
    }

    function nextSlide() {
      current = (current + 1) % slides.length;
      showSlide(current);
    }

    function prevSlide() {
      current = (current - 1 + slides.length) % slides.length;
      showSlide(current);
    }

    function goToSlide(index) {
      current = index;
      showSlide(current);
    }

    showSlide(current);

    nextBtn.addEventListener("click", nextSlide);
    prevBtn.addEventListener("click", prevSlide);

    let timer = setInterval(nextSlide, 25000);
    const slider = document.querySelector(".testimonials-slider");

    slider.addEventListener("mouseenter", () => clearInterval(timer));
    slider.addEventListener("mouseleave", () => {
      clearInterval(timer);
      timer = setInterval(nextSlide, 25000);
    });
  });
  </script>
</head>

<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-brand" href="{{ '/' | relative_url }}">Humberto Martinez-Garcia</a>

      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}" class="mainNav{% if page.url == '/' %} active{% endif %}">About</a>
        <a href="{{ '/research/' | relative_url }}" class="mainNav{% if page.url contains '/research' %} active{% endif %}">Research</a>
        <a href="{{ '/teaching/' | relative_url }}" class="mainNav{% if page.url contains '/teaching' %} active{% endif %}">Teaching</a>
        <a href="{{ '/files/cv.pdf' | relative_url }}" class="mainNav">CV</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>Humberto Martinez-Garcia</span>
      <div class="footer-links">
        <a href="mailto:hmartinez@colmex.mx">hmartinez@colmex.mx</a>
        <a href="{{ '/' | relative_url }}">Home</a>
      </div>
    </div>
  </footer>
</body>
</html>
