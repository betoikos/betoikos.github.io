				<script>
				document.addEventListener("DOMContentLoaded", function() {
				  const slides = document.querySelectorAll(".quote-slide");
				  const prevBtn = document.querySelector(".quote-nav.prev");
				  const nextBtn = document.querySelector(".quote-nav.next");
				  const dotsContainer = document.querySelector(".quote-dots");

				  if (!slides.length) return;

				  let current = Math.floor(Math.random() * slides.length);

				  // Create dots
				  slides.forEach((_, i) => {
					const dot = document.createElement("button");
					dot.addEventListener("click", () => goToSlide(i));
					dotsContainer.appendChild(dot);
				  });
				  const dots = dotsContainer.querySelectorAll("button");

				  function showSlide(index) {
					slides.forEach((s, i) => s.classList.toggle("active", i === index));
					dots.forEach((d, i) => d.classList.toggle("active", i === index));
				  }

				  function nextSlide() {
					current = (current + 1) % slides.length;
					showSlide(current);
				  }

				  function prevSlide() {
					current = (current - 1 + slides.length) % slides.length;
					showSlide(current);
				  }

				  function goToSlide(index) {
					current = index;
					showSlide(current);
				  }

				  // Initialize
				  showSlide(current);

				  // Events
				  nextBtn.addEventListener("click", nextSlide);
				  prevBtn.addEventListener("click", prevSlide);

				  // Auto rotate
				  let timer = setInterval(nextSlide, 25000);
				  const slider = document.querySelector(".testimonials-slider");
				  slider.addEventListener("mouseenter", () => clearInterval(timer));
				  slider.addEventListener("mouseleave", () => timer = setInterval(nextSlide, 25000));
				});
				</script>
