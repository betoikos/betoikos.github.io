			<script>
			document.addEventListener("DOMContentLoaded", function() {
			  const slides = document.querySelectorAll(".quote-slide");
			  const prevBtn = document.querySelector(".quote-nav.prev");
			  const nextBtn = document.querySelector(".quote-nav.next");

			  if (!slides.length) return;

			  // start at a random quote
			  let current = Math.floor(Math.random() * slides.length);
			  slides[current].classList.add("active");

			  function showSlide(index) {
				slides.forEach(s => s.classList.remove("active"));
				slides[index].classList.add("active");
			  }

			  function nextSlide() {
				current = (current + 1) % slides.length;
				showSlide(current);
			  }

			  function prevSlide() {
				current = (current - 1 + slides.length) % slides.length;
				showSlide(current);
			  }

			  nextBtn.addEventListener("click", nextSlide);
			  prevBtn.addEventListener("click", prevSlide);

			  // auto-rotate every 25 seconds
			  let timer = setInterval(nextSlide, 25000);

			  // pause on hover
			  const slider = document.querySelector(".testimonials-slider");
			  slider.addEventListener("mouseenter", () => clearInterval(timer));
			  slider.addEventListener("mouseleave", () => timer = setInterval(nextSlide, 25000));
			});
			</script>
